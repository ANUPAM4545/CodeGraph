name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './apps/web/package-lock.json'
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test --if-present
    - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run: pip install pytest pytest-asyncio pytest-mock
    - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - run: PYTHONPATH=.:src:../.. pytest tests

  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Web Image
      run: docker build -t codegraph-web ./apps/web
    - name: Build API Image
      run: docker build -t codegraph-api ./apps/api
    - name: Build Worker Image
      run: docker build -t codegraph-worker -f ./apps/worker/Dockerfile ./apps/api
